# Comptes rendus : rappel aux entreprises deux jours avant l'échéance de leurs
# actions (le vendredi : échéances de lundi et mardi comprises). Tous les
# matins en semaine (06:40 UTC : 8 h 40 l'été, 7 h 40 l'hiver à Paris), voir
# src/app/api/cron/echeances/route.js. Un seul rappel par échéance.
# Secrets GitHub requis : APP_URL et CRON_SECRET (comme le mail du matin).
name: CR — rappel des échéances aux entreprises

on:
  schedule:
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  echeances:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Envoyer les rappels d'échéance
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL / CRON_SECRET absents : rappels ignorés."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/echeances"
