# Vérification horaire des devis Qonto (acceptés / annulés) → CRM + notifications.
# Secrets GitHub requis : APP_URL (ex. https://claud-dusky.vercel.app) et
# CRON_SECRET (même valeur que la variable CRON_SECRET dans Vercel).
name: Suivi des devis Qonto

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier les statuts Qonto
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL / CRON_SECRET absents : vérification ignorée."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/qonto-status"
